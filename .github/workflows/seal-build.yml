name: seal-build

on:
  workflow_dispatch:

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: node:14-bullseye
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: node --version && npm --version

      - name: Pack the release tarball
        run: npm pack

      - uses: actions/upload-artifact@v4
        with:
          name: npm-tarball
          path: websocket-driver-0.7.4.tgz
          if-no-files-found: error
